<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier List Maker + GitHub Cloud Persistence</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <style>
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 100px; }
    
    .header-bar {
      width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
    }
    .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; background: #222; padding: 6px 12px; border-radius: 20px; }

    /* Panel de control */
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    button, label.btn {
      background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px;
      cursor: pointer; border-radius: 4px; font-size: 14px;
    }
    button:hover, label.btn:hover { background: #444; }
    button.btn-save { background: #28a745; border-color: #28a745; }
    button.btn-save:hover { background: #218838; }
    input[type="file"] { display: none; }

    /* Tier List */
    .tier-list { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 2px; background: #000; border: 2px solid #000; }
    .tier-row { display: flex; min-height: 80px; background: #1a1a1a; }
    
    .tier-header {
      width: 120px; display: flex; align-items: center; justify-content: space-between;
      padding: 5px; color: #000; font-weight: bold; position: relative;
    }
    .tier-label { outline: none; font-size: 18px; width: 80%; text-align: center; word-break: break-word; }
    .tier-color-picker { width: 18px; height: 18px; border: none; cursor: pointer; background: transparent; }

    .tier-dropzone {
      flex: 1; display: flex; flex-wrap: wrap; gap: 5px; padding: 5px;
      background: #222; min-height: 80px; align-items: center;
    }
    .tier-dropzone.drag-over { background: #333; }

    .tier-actions { display: flex; flex-direction: column; justify-content: center; background: #111; padding: 2px; }
    .tier-actions button { background: transparent; border: none; color: #888; font-size: 12px; padding: 4px; }
    .tier-actions button:hover { color: #fff; }

    /* Banco de elementos */
    .bank-container { width: 100%; max-width: 900px; margin-top: 20px; }
    .bank-title { margin-bottom: 8px; font-size: 16px; }
    .item-bank {
      min-height: 90px; background: #1a1a1a; border: 2px dashed #444;
      display: flex; flex-wrap: wrap; gap: 5px; padding: 10px;
    }

    /* Items */
    .draggable-item {
      width: 70px; height: 70px; object-fit: cover; cursor: grab;
      user-select: none; border-radius: 2px;
    }
    .draggable-item:active { cursor: grabbing; }

    /* Trash Bin */
    .trash-bin {
      position: fixed; bottom: 25px; right: 25px;
      width: 70px; height: 70px; background: #dc3545; border: 2px solid #ff6b6b;
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      font-size: 30px; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 500; cursor: pointer; transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .trash-bin.drag-over { background: #bd2130; border-color: #fff; transform: scale(1.15); }

    /* Modales */
    .modal {
      display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content { background: #222; padding: 20px; border-radius: 6px; max-width: 400px; width: 90%; }
    .modal-content input[type="text"] {
      width: 100%; padding: 10px; margin: 15px 0; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px;
    }
    .img-container { max-height: 350px; margin-bottom: 15px; background: #000; }
    .img-container img { max-width: 100%; }

    /* Indicator de carga */
    .loading-status { font-size: 12px; color: #aaa; margin-left: 10px; display: none; }
  </style>
</head>
<body>

  <!-- Modal de Usuario -->
  <div class="modal" id="userModal">
    <div class="modal-content">
      <h2>Ingresar usuario</h2>
      <p style="color: #aaa; font-size: 14px; margin-top: 5px;">Ingresa tu nombre. Se cargará tu archivo JSON directamente desde GitHub.</p>
      <input type="text" id="usernameInput" placeholder="Nombre de usuario..." autofocus>
      <button onclick="loginUser()" style="width: 100%; background: #28a745; padding: 10px; font-weight: bold;">Entrar y Cargar</button>
    </div>
  </div>

  <div class="header-bar">
    <h1>Tier List Maker</h1>
    <div class="user-info">
      👤 <span id="currentUserDisplay">Invitado</span>
      <span class="loading-status" id="loadingStatus">Cargando...</span>
      <button onclick="switchUser()" style="padding: 2px 8px; font-size: 11px;">Cambiar</button>
    </div>
  </div>

  <div class="controls">
    <label class="btn" for="imageInput">Subir Imagen</label>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="addTier('NUEVO', '#858585')">+ Agregar Fila</button>
    <button class="btn-save" onclick="saveToGitHub()">☁️ Guardar en GitHub</button>
  </div>

  <div class="tier-list" id="tierList"></div>

  <div class="bank-container">
    <div class="bank-title">Banco de Imágenes</div>
    <div class="item-bank tier-dropzone" id="bank"></div>
  </div>

  <!-- Trash Bin -->
  <div class="trash-bin" id="trashBin" title="Arrastra una imagen aquí para eliminarla">🗑️</div>

  <!-- Modal Recorte -->
  <div class="modal" id="cropModal" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
      <div class="img-container">
        <img id="cropImage" src="">
      </div>
      <div style="display:flex; justify-content: flex-end; gap:10px;">
        <button onclick="closeCropModal()">Cancelar</button>
        <button onclick="cropAndSave()" style="background:#28a745;">Guardar Imagen</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    /* --- CONFIGURACIÓN DE GITHUB --- */
    const GH_OWNER = 'TU_USUARIO_GITHUB';  // Cambia por tu usuario de GitHub
    const GH_REPO  = 'TU_REPOSITORIO';      // Cambia por el nombre de tu repositorio
    const GH_TOKEN = 'TU_PERSONAL_ACCESS_TOKEN'; // Tu token de acceso personal
    
    let currentSha = null; // Necesario para actualizar archivos existentes en GitHub
    let cropper = null;
    let draggedItem = null;
    let currentUser = null;

    const defaultTiers = [
      { name: 'S', color: '#ff7f7f' },
      { name: 'A', color: '#ffbf7f' },
      { name: 'B', color: '#ffff7f' },
      { name: 'C', color: '#7fff7f' }
    ];

    window.onload = () => {
      setupDragAndDrop();
    };

    /* --- INTEGRACIÓN CON LA API REST DE GITHUB --- */
    
    // Convertir texto/JSON a Base64 con soporte para Unicode (UTF-8)
    function utf8_to_b64(str) {
      return window.btoa(unescape(encodeURIComponent(str)));
    }

    // Convertir Base64 a texto/JSON con soporte para Unicode (UTF-8)
    function b64_to_utf8(str) {
      return decodeURIComponent(escape(window.atob(str)));
    }

    async function loginUser() {
      const username = document.getElementById('usernameInput').value.trim().toLowerCase();
      if (!username) return alert('Ingresa un nombre de usuario válido');

      currentUser = username;
      document.getElementById('currentUserDisplay').innerText = currentUser;
      document.getElementById('userModal').style.display = 'none';

      await loadFromGitHub(currentUser);
    }

    function switchUser() {
      document.getElementById('usernameInput').value = '';
      document.getElementById('userModal').style.display = 'flex';
    }

    // CARGAR JSON DESDE GITHUB (GET)
    async function loadFromGitHub(username) {
      showStatus('Buscando datos en GitHub...');
      const filePath = `data/${username}.json`;
      const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${filePath}`;

      try {
        const response = await fetch(url, {
          headers: {
            'Authorization': `token ${GH_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (response.status === 404) {
          showStatus('Nuevo usuario: cargando plantilla inicial.');
          currentSha = null; // No existe archivo previo
          renderFromData({
            tiers: defaultTiers.map(t => ({ name: t.name, color: t.color, items: [] })),
            bank: []
          });
        } else if (response.ok) {
          const fileData = await response.json();
          currentSha = fileData.sha; // Guardamos el SHA para la próxima actualización

          // La API devuelve el contenido codificado en Base64
          const jsonText = b64_to_utf8(fileData.content.replace(/\n/g, ''));
          const data = JSON.parse(jsonText);
          
          renderFromData(data);
          showStatus('¡Datos cargados desde GitHub!');
        } else {
          alert('Error al conectar con la API de GitHub.');
        }
      } catch (err) {
        console.error(err);
        alert('Ocurrió un error al intentar cargar los datos.');
      } finally {
        hideStatus();
      }
    }

    // GUARDAR JSON EN GITHUB (PUT)
    async function saveToGitHub() {
      if (!currentUser) return;

      showStatus('Guardando en GitHub...');
      const data = buildDataStructure();
      const jsonString = JSON.stringify(data, null, 2);
      const contentB64 = utf8_to_b64(jsonString);

      const filePath = `data/${currentUser}.json`;
      const url = `https://api.github.com/repos/${venticoops}/${octiermaker.github.io}/contents/${filePath}`;

      const payload = {
        message: `Guardado automático de ${currentUser}`,
        content: contentB64
      };

      // Si el archivo ya existía en GitHub, es obligatorio enviar su sha
      if (currentSha) {
        payload.sha = currentSha;
      }

      try {
        const response = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${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}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const resData = await response.json();
          currentSha = resData.content.sha; // Actualizamos el SHA
          alert(`¡Estado guardado correctamente en GitHub para ${currentUser}!`);
        } else {
          const errData = await response.json();
          alert(`Error al guardar en GitHub: ${errData.message}`);
        }
      } catch (err) {
        console.error(err);
        alert('Error de conexión al guardar.');
      } finally {
        hideStatus();
      }
    }

    /* --- CONSTRUCCIÓN DE ESTRUCTURA Y DOM --- */
    function buildDataStructure() {
      const tiers = [];
      document.querySelectorAll('.tier-row').forEach(row => {
        const name = row.querySelector('.tier-label').innerText;
        const color = row.querySelector('.tier-color-picker').value;
        const items = [];
        row.querySelectorAll('.draggable-item').forEach(img => items.push(img.src));
        tiers.push({ name, color, items });
      });

      const bank = [];
      document.querySelectorAll('#bank .draggable-item').forEach(img => bank.push(img.src));

      return { user: currentUser, tiers, bank };
    }

    function renderFromData(data) {
      const tierList = document.getElementById('tierList');
      const bank = document.getElementById('bank');
      
      tierList.innerHTML = '';
      bank.innerHTML = '';

      data.tiers.forEach(t => {
        const row = createTierRowElement(t.name, t.color);
        const dropzone = row.querySelector('.tier-dropzone');
        t.items.forEach(src => dropzone.appendChild(createImageElement(src)));
        tierList.appendChild(row);
      });

      data.bank.forEach(src => bank.appendChild(createImageElement(src)));
    }

    function addTier(name, color) {
      document.getElementById('tierList').appendChild(createTierRowElement(name, color));
    }

    function createTierRowElement(name, color) {
      const row = document.createElement('div');
      row.className = 'tier-row';
      row.innerHTML = `
        <div class="tier-header" style="background-color: ${color}">
          <span class="tier-label" contenteditable="true">${name}</span>
          <input type="color" class="tier-color-picker" value="${color}" onchange="changeColor(this)">
        </div>
        <div class="tier-dropzone"></div>
        <div class="tier-actions">
          <button onclick="deleteTier(this)">✕</button>
        </div>
      `;
      return row;
    }

    function createImageElement(src) {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'draggable-item';
      img.draggable = true;
      return img;
    }

    function deleteTier(btn) {
      const row = btn.closest('.tier-row');
      const dropzone = row.querySelector('.tier-dropzone');
      const bank = document.getElementById('bank');
      while (dropzone.firstChild) {
        bank.appendChild(dropzone.firstChild);
      }
      row.remove();
    }

    function changeColor(input) {
      input.parentElement.style.backgroundColor = input.value;
    }

    /* --- DRAG & DROP & TRASH BIN --- */
    function setupDragAndDrop() {
      document.addEventListener('dragstart', (e) => {
        if (e.target.classList.contains('draggable-item')) {
          draggedItem = e.target;
          e.dataTransfer.setData('text/plain', '');
        }
      });

      document.addEventListener('dragover', (e) => {
        const dropzone = e.target.closest('.tier-dropzone');
        const trash = e.target.closest('.trash-bin');

        if (dropzone) {
          e.preventDefault();
          dropzone.classList.add('drag-over');
        } else if (trash) {
          e.preventDefault();
          trash.classList.add('drag-over');
        }
      });

      document.addEventListener('dragleave', (e) => {
        const dropzone = e.target.closest('.tier-dropzone');
        const trash = e.target.closest('.trash-bin');

        if (dropzone) dropzone.classList.remove('drag-over');
        if (trash) trash.classList.remove('drag-over');
      });

      document.addEventListener('drop', (e) => {
        const dropzone = e.target.closest('.tier-dropzone');
        const trash = e.target.closest('.trash-bin');

        if (trash && draggedItem) {
          e.preventDefault();
          trash.classList.remove('drag-over');
          draggedItem.remove();
          draggedItem = null;
        } else if (dropzone && draggedItem) {
          e.preventDefault();
          dropzone.classList.remove('drag-over');
          dropzone.appendChild(draggedItem);
          draggedItem = null;
        }
      });
    }

    /* --- CROPPER --- */
    const imageInput = document.getElementById('imageInput');
    const cropModal = document.getElementById('cropModal');
    const cropImage = document.getElementById('cropImage');

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          cropImage.src = event.target.result;
          cropModal.style.display = 'flex';
          if (cropper) cropper.destroy();
          cropper = new Cropper(cropImage, { aspectRatio: 1, viewMode: 1 });
        };
        reader.readAsDataURL(file);
      }
      imageInput.value = '';
    });

    function cropAndSave() {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({ width: 150, height: 150 });
      const img = createImageElement(canvas.toDataURL('image/png'));
      document.getElementById('bank').appendChild(img);
      closeCropModal();
    }

    function closeCropModal() {
      cropModal.style.display = 'none';
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
    }

    /* --- HELPERS UI --- */
    function showStatus(msg) {
      const el = document.getElementById('loadingStatus');
      el.innerText = msg;
      el.style.display = 'inline';
    }

    function hideStatus() {
      document.getElementById('loadingStatus').style.display = 'none';
    }
  </script>
</body>
</html>
